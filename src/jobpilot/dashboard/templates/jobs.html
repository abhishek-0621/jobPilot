{% extends "base.html" %}
{% block title %}Jobs{% endblock %}
{% block content %}
<h1>Jobs</h1>
{% if flash %}<p class="card" role="status">{{ flash }}</p>{% endif %}
<p><button type="button" hx-post="/ui/runs/discovery" hx-target="#discover-result" hx-swap="innerHTML">Discover</button> <a href="/ui/jobs/new">Add a job</a></p>
<div id="discover-result"></div>
<form id="job-filters" class="card filters" method="get" action="/ui/jobs" hx-get="/ui/jobs" hx-target="#jobs-results" hx-swap="outerHTML" hx-push-url="true" hx-trigger="change, input changed delay:400ms from:input[type=search], submit">
<label>Search <input type="search" name="q" value="{{ f.q }}" maxlength="200" placeholder="title, company, description"></label>
<label>Location <input type="search" name="location" id="f-location" value="{{ f.location }}" maxlength="200"></label>
<span class="quick">{% for chip in ("India", "Remote") %}<a href="/ui/jobs?location={{ chip|urlencode }}" hx-get="/ui/jobs?location={{ chip|urlencode }}" hx-target="#jobs-results" hx-swap="outerHTML" hx-push-url="true">{{ chip }}</a> {% endfor %}</span>
<label>Company <select name="company" multiple size="4">{% for c in companies %}<option value="{{ c }}"{% if c in f.company %} selected{% endif %}>{{ c }}</option>{% endfor %}</select></label>
<label>Source <select name="source" multiple size="4">{% for src in sources %}<option value="{{ src }}"{% if src in f.source %} selected{% endif %}>{{ board_label(src) or src }}</option>{% endfor %}</select></label>
<label>Status <select name="status" multiple size="4">{% for st in statuses %}<option value="{{ st }}"{% if st in f.status %} selected{% endif %}>{{ st }}</option>{% endfor %}</select></label>
<label>Work mode <select name="work_mode"><option value="">Any</option>{% for wm in work_modes %}<option value="{{ wm }}"{% if wm == f.work_mode %} selected{% endif %}>{{ wm }}</option>{% endfor %}</select></label>
<label>Apply <select name="apply_mode"><option value="">Any</option>{% for am in ("automated", "manual") %}<option value="{{ am }}"{% if am == f.apply_mode %} selected{% endif %}>{{ am }}</option>{% endfor %}</select></label>
<label>Min score <input type="number" name="min_score" min="0" max="100" step="1" value="{{ "%g"|format(f.min_score) if f.min_score is not none else "" }}"></label>
<label>Posted within <select name="posted_within"><option value="">Any time</option>{% for d in posted_options %}<option value="{{ d }}"{% if d == f.posted_within %} selected{% endif %}>{{ d }} days</option>{% endfor %}</select></label>
<label>Sort <select name="sort">{% for so in sorts %}<option value="{{ so }}"{% if so == f.sort %} selected{% endif %}>{{ {"score": "Score", "posted": "Posted date", "company": "Company"}[so] }}</option>{% endfor %}</select></label>
<label><input type="checkbox" name="show_duplicates" value="1"{% if f.show_duplicates %} checked{% endif %}> Show duplicates</label>
<button type="submit">Filter</button> <a href="/ui/jobs">Clear all</a>
</form>
<form id="apply-form" method="post" action="/ui/jobs/apply" hx-post="/ui/jobs/apply" hx-target="#apply-result" hx-swap="innerHTML">
<div class="action-bar" data-action-bar="job_ids" hidden><span><span class="num" data-count>0</span> selected</span><button type="submit" class="primary">Start applications</button></div>
</form>
<div id="apply-result"></div>
{% include "_jobs_results.html" %}
{% endblock %}
