<!doctype html>
<html><head><meta charset="utf-8"><title>Lever-like application</title></head>
<body>
<h1>Apply for Platform Engineer</h1>
<form id="application-form" onsubmit="return false">
  <label>Full name <input type="text" name="name" required></label>
  <label>Email <input type="email" name="email" required></label>
  <label>Phone <input type="tel" name="phone"></label>
  <label>Current company <input type="text" name="org"></label>
  <label>LinkedIn URL <input type="text" name="urls[LinkedIn]"></label>
  <div class="application-question resume"><div class="text">Resume/CV *</div>
    <button type="button" class="visible-resume-upload">Attach resume</button>
    <input type="file" name="resume" style="display:none"></div>
  <label>Additional information <textarea name="comments"></textarea></label>
  <div class="application-question custom-question">
    <label>Describe a system you scaled <textarea name="cards[abc][field0]"></textarea></label>
  </div>
  <div class="application-question custom-question">
    <label>Preferred start date <input type="text" name="cards[abc][field1]"></label>
  </div>
  <button type="submit" class="template-btn-submit"
    onclick="window.__submitted = true; event.preventDefault();">Submit application</button>
</form>
</body></html>
