<!doctype html>
<html><head><meta charset="utf-8"><title>Application form</title></head>
<body>
<h1>Apply for Backend Engineer</h1>

<form id="application_form" method="post" action="/submit_noop" enctype="multipart/form-data">
  <div class="field"><label for="first_name">First Name *</label>
    <input type="text" id="first_name" name="first_name" required></div>
  <div class="field"><label for="email">Email *</label>
    <input type="email" id="email" name="email" required></div>
  <div class="field"><label for="resume">Resume/CV *</label>
    <input type="file" id="resume" name="resume"></div>
  <button type="submit" id="submit_app"
    onclick="sessionStorage.setItem('jp_clicked', '1')">Submit Application</button>
</form>
<script>  // after the (no-op) submit reloads this page it shows a static error text
if (sessionStorage.getItem('jp_clicked')) {
  const p = document.createElement('p'); p.className = 'error';
  p.textContent = 'Something went wrong, please review your answers.';
  document.getElementById('application_form').prepend(p);
}
</script>
</body></html>
