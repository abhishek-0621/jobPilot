# Open-ended application questions -> question key. Matched on the normalised label and
# help text (lower case, punctuation removed), phrase by phrase. Order matters: the first
# key with a matching phrase wins, so put the more specific keys first.
# Sensitive questions (compensation, reasons for leaving, demographics, legal ...) are
# classified first and are never essays.
version: 1
keys:
  # "why <company>" / "what excites you about <company>" are also matched with the
  # job's company name (code, not this file).
