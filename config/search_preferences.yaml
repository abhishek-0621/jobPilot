search:
  target_titles:
    - GenAI Engineer
    - Applied AI Engineer
    - AI Engineer
    - Search / RAG Engineer
  # "India" matches Indian cities/states (config/india_locations.yaml); "Remote" keeps only
  # remote jobs open to India (worldwide, APAC/Asia, IST); "Remote - USA only" is dropped.
  locations:
    - India
    - Remote
  work_modes: [remote, hybrid, onsite]
  sources:
    - company_careers
    - greenhouse
    - lever
    - linkedin
    - naukri
  min_match_score: 70
  max_jobs_per_run: 100
  exclude_keywords:
    - unpaid
  require_user_review_for_new_sources: true
  # Public remote-job boards to read (all manual-apply). Remove any you don't want.
  remote_boards: [himalayas, remotive, weworkremotely, remoteok, jobicy, workingnomads]
