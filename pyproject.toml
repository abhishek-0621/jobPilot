[project]
name = "jobpilot"
version = "0.1.0"
description = "Local-first job-application system"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.2",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
jobpilot = "jobpilot.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Starlette TestClient nags about httpx2; httpx is the project-wide client.
    "ignore:Using `httpx` with `starlette.testclient`",
]
