name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Migrations have no drift
        run: |
          uv run alembic -x db_path=$RUNNER_TEMP/ci.db upgrade head
          uv run alembic -x db_path=$RUNNER_TEMP/ci.db check
